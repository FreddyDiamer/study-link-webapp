version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vue:
        patterns: ['vue', 'vue-*', '@vue/*', 'pinia', '@vitejs/*', 'vite*']
      dev-tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
